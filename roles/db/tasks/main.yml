---
- name: Install PostgreSQL and its Python driver
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure PostgreSQL is running and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Discover the active PostgreSQL configuration file
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SHOW config_file
  become_user: postgres
  register: postgresql_config_file
  changed_when: false

- name: Listen for PostgreSQL connections on all network interfaces
  ansible.builtin.lineinfile:
    path: "{{ postgresql_config_file.stdout | trim }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Allow the application user to connect to its database
  ansible.builtin.lineinfile:
    path: "{{ (postgresql_config_file.stdout | trim | dirname) }}/pg_hba.conf"
    line: "host    {{ db_name }}    {{ db_user }}    0.0.0.0/0    scram-sha-256"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Check whether the application PostgreSQL user exists
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_user }}'"
  become_user: postgres
  register: db_user_exists
  changed_when: false

- name: Create the application PostgreSQL user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - "CREATE ROLE \"{{ db_user }}\" LOGIN PASSWORD '{{ db_pass | replace(\"'\", \"''\") }}'"
  become_user: postgres
  when: db_user_exists.stdout | trim != '1'
  no_log: true

- name: Check whether the application database exists
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'"
  become_user: postgres
  register: db_database_exists
  changed_when: false

- name: Create the application database
  ansible.builtin.command:
    argv:
      - createdb
      - --owner={{ db_user }}
      - "{{ db_name }}"
  become_user: postgres
  when: db_database_exists.stdout | trim != '1'

- name: Grant the application user access to its database
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - "GRANT ALL PRIVILEGES ON DATABASE \"{{ db_name }}\" TO \"{{ db_user }}\""
  become_user: postgres
  changed_when: false
