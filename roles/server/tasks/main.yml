---
- name: Install Apache, PHP, Composer, Node.js, and Laravel dependencies
  ansible.builtin.apt:
    name:
      - apache2
      - composer
      - git
      - nodejs
      - npm
      - php
      - php-cli
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      - php-pgsql
      - libapache2-mod-php
    state: present
    update_cache: true

- name: Enable Apache rewrite module
  ansible.builtin.command:
    cmd: a2enmod rewrite
    creates: /etc/apache2/mods-enabled/rewrite.load
  notify: Reload Apache

- name: Clone the Laravel application
  ansible.builtin.git:
    repo: "{{ laravel_repository }}"
    dest: "{{ laravel_app_dir }}"
    version: main
    force: false

- name: Install Laravel PHP dependencies
  ansible.builtin.command:
    cmd: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
    chdir: "{{ laravel_app_dir }}"
    creates: "{{ laravel_app_dir }}/vendor/autoload.php"

- name: Install Laravel frontend dependencies
  ansible.builtin.command:
    cmd: npm install
    chdir: "{{ laravel_app_dir }}"
    creates: "{{ laravel_app_dir }}/node_modules"

- name: Build Laravel frontend assets
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ laravel_app_dir }}"
    creates: "{{ laravel_app_dir }}/public/build/manifest.json"

- name: Configure Laravel environment
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ laravel_app_dir }}/.env"
    owner: www-data
    group: www-data
    mode: '0640'
  no_log: true

- name: Set Laravel writable directory ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: www-data
    group: www-data
    recurse: true
  loop:
    - "{{ laravel_app_dir }}/storage"
    - "{{ laravel_app_dir }}/bootstrap/cache"

- name: Run Laravel database migrations
  ansible.builtin.command:
    cmd: php artisan migrate --force
    chdir: "{{ laravel_app_dir }}"
  environment:
    APP_ENV: production

- name: Install Apache virtual host for Laravel
  ansible.builtin.template:
    src: laravel.conf.j2
    dest: /etc/apache2/sites-available/laravel.conf
    mode: '0644'
  notify: Reload Apache

- name: Enable Laravel Apache virtual host
  ansible.builtin.command:
    cmd: a2ensite laravel.conf
    creates: /etc/apache2/sites-enabled/laravel.conf
  notify: Reload Apache

- name: Disable Apache default virtual host
  ansible.builtin.command:
    cmd: a2dissite 000-default.conf
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Reload Apache

- name: Ensure Apache is running and enabled
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
